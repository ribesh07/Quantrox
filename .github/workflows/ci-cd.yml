name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantrox
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Run backend smoke tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/quantrox?schema=public
          JWT_SECRET: test-secret
        run: |
          npx prisma migrate deploy
          node dist/index.js > backend.log 2>&1 &
          pid=$!
          echo "Waiting for backend to become healthy..."
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:3001/health | grep -q '"status":"ok"'; then
              echo 'Backend healthy'
              break
            fi
            sleep 2
          done
          node scripts/smoke-test.js
          kill $pid || true

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/quantrox/frontend:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/quantrox/frontend:latest
          file: ./frontend/Dockerfile
          context: ./frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          push: true
          registry: ${{ secrets.DOCKER_REGISTRY }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/quantrox/backend:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/quantrox/backend:latest
          file: ./backend/Dockerfile
          context: ./
