version: '3.8'
services:
  backend:
    image: ${DOCKER_REGISTRY:-your-registry}/quantrox/backend:latest
    restart: on-failure
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    ports:
      - '3001:3001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: ${DOCKER_REGISTRY:-your-registry}/quantrox/frontend:latest
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:3001/api}
      - INTERNAL_API_URL=http://backend:3001/api
    ports:
      - '3056:3056'
